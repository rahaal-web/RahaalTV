<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12101c;--surface:#1c1930;--line:#2c2848;--text:#f3f0ff;--muted:#a49fc4;--accent:#f2b84b;--accent-ink:#2a1d00;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Readex Pro',Tahoma,sans-serif;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1240px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(18,16,28,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem;padding-inline-start:2px}
.lbl{color:var(--muted);font-weight:400;font-size:.95rem;border-inline-start:1px solid var(--line);padding-inline-start:14px;margin-inline-start:4px}
.rate{color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:10px;padding:11px 26px;border-radius:99px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(242,184,75,.35)}
.ad{padding:30px 0}
.ad-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.ad h1{font-size:1.7rem}
.note{color:var(--muted);font-size:.9rem;margin-bottom:22px;max-width:75ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.stat b{display:block;font-size:1.9rem;line-height:1.3;color:var(--accent)}
.stat span{color:var(--muted);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools input{flex:1;min-width:200px}
.fi,.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:8px 12px;width:100%}
.fi:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.tools select{width:auto}
.btn.g{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn.g:hover{border-color:var(--accent);box-shadow:none}
.btn.sm{padding:7px 18px;font-size:.9rem}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-weight:400;background:var(--surface)}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(255,255,255,.03)}
tr:last-child td{border-bottom:0}
.th{width:42px;height:63px;border-radius:6px;object-fit:cover;display:block}
.ib{display:inline-block;padding:3px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;margin-inline-end:6px;transition:border-color .2s,color .2s}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib.del:hover{border-color:#ff7b7b;color:#ff7b7b}
dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:26px;width:min(740px,94vw);max-height:92vh;overflow:auto;margin:auto}
dialog[open]{animation:rise .35s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
dialog h2{margin-bottom:16px;font-size:1.25rem}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.f.w{grid-column:1/-1}
.f textarea{min-height:90px;resize:vertical}
.f small{font-size:.8rem}
.pp{display:flex;gap:12px;align-items:center}
.pp img{width:54px;height:81px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.hid{display:none!important}
#toast{position:fixed;bottom:26px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--accent);color:var(--accent-ink);padding:10px 24px;border-radius:99px;font-weight:600;z-index:50;opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
#toast.on{opacity:1;transform:none}
@media(max-width:600px){.fg{grid-template-columns:1fr}}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 85% -10%,rgba(242,184,75,.14),transparent),radial-gradient(700px 500px at 0 110%,rgba(120,90,255,.16),transparent),var(--bg)}
.lc{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px;animation:rise .6s var(--ease);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lc h1{font-size:1.5rem;margin:18px 0 4px}.lc p{color:var(--muted);margin-bottom:22px;font-size:.92rem}.lc .f{margin-bottom:14px}.lc .btn{width:100%;justify-content:center}
.pw{position:relative}.pw button{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);font-size:.8rem;color:var(--muted)}
.err{color:#ff8b8b;font-size:.88rem;min-height:1.5em;margin-bottom:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);margin-bottom:16px}.chk input{width:auto}
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sb{position:sticky;top:0;height:100vh;background:#0f0d18;border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.sb .brand{padding:6px 10px 14px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-align:start;width:100%;transition:background .2s,color .2s}
.nv svg{width:19px;height:19px;flex:none}.nv:hover{background:var(--surface);color:var(--text)}.nv.on{background:rgba(242,184,75,.12);color:var(--accent)}
.dot2{margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sg{color:#6f6a92;font-size:.78rem;padding:16px 12px 4px}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.main{min-width:0}
.tb2{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:rgba(18,16,28,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb2 h1{font-size:1.2rem;line-height:1.3}.tb2 small{color:var(--muted)}.tb2 .sp{margin-inline-start:auto;display:flex;gap:8px}
.pg2{padding:26px 28px 60px;animation:fade .4s}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}.panel h3{font-size:1.02rem;margin-bottom:14px}
.panel>p{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}
.r{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;margin-bottom:9px;font-size:.88rem}
.t2{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.t2 i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width 1s var(--ease)}
.li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.li img{width:36px;height:54px;border-radius:6px;object-fit:cover}.li div{flex:1;min-width:0}.li b{display:block;font-size:.93rem}.li small{color:var(--muted)}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);white-space:nowrap}
.ok{color:#7ee0a1;border-color:rgba(126,224,161,.35)}.warn{color:#ffb86b;border-color:rgba(255,184,107,.4)}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,184,107,.1);border:1px solid rgba(255,184,107,.35);color:#ffd2a1;border-radius:12px;padding:10px 16px;margin-bottom:18px;font-size:.9rem}
.steps{counter-reset:s;display:grid;gap:12px;padding:0;list-style:none}.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.form1{max-width:480px;display:grid;gap:14px}.row2{display:flex;gap:10px;flex-wrap:wrap}
.burger{display:none}
@keyframes fade{from{opacity:0}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sb{position:fixed;inset-block:0;inset-inline-start:0;width:262px;z-index:40;transform:translateX(100%);transition:transform .3s var(--ease)}.sb.open{transform:none}.burger{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}.pg2,.tb2{padding-inline:16px}.tb2 .sp a{display:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function art(title, w, h){
  const a = hue(title), b = (a+60)%360, c = (a+190)%360, r = [...title].length % 3;
  const sun = r===0 ? `<circle cx="${w*.7}" cy="${h*.3}" r="${w*.16}" fill="hsl(${b} 90% 70%)" opacity=".9"/>`
    : r===1 ? `<circle cx="${w*.3}" cy="${h*.32}" r="${w*.2}" fill="none" stroke="hsl(${b} 90% 70%)" stroke-width="${w*.015}"/><circle cx="${w*.3}" cy="${h*.32}" r="${w*.1}" fill="hsl(${b} 90% 70%)"/>`
    : `<path d="M0 ${h*.2}L${w} ${h*.05}V${h*.15}L0 ${h*.32}Z" fill="hsl(${b} 90% 65%)" opacity=".75"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><defs>
    <linearGradient id="g" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="hsl(${a} 55% 30%)"/><stop offset="1" stop-color="hsl(${c} 50% 10%)"/></linearGradient>
    <linearGradient id="f" x1="0" y1=".4" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#g)"/>${sun}
    <path d="M0 ${h*.72}L${w*.22} ${h*.5}L${w*.45} ${h*.68}L${w*.7} ${h*.42}L${w} ${h*.66}V${h}H0Z" fill="hsl(${c} 45% 16%)" opacity=".85"/>
    <path d="M0 ${h*.84}L${w*.3} ${h*.62}L${w*.58} ${h*.8}L${w*.82} ${h*.6}L${w} ${h*.78}V${h}H0Z" fill="hsl(${c} 40% 9%)"/>
    <rect width="${w}" height="${h}" fill="url(#f)"/>
    <text x="${w/2}" y="${h*.9}" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="${w*(h>w?.085:.05)}" fill="#fff">${esc(title.replace('عنوان تجريبي: ',''))}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

let syncQ = Promise.resolve();
async function pushChanges(){
  const cur = new Map(ITEMS.map(i => [i.id, JSON.stringify(i)]));
  const ops = [...ITEMS.filter(i => SYNCED.get(i.id) !== cur.get(i.id)).map(i => ['set', i]), ...[...SYNCED.keys()].filter(id => !cur.has(id)).map(id => ['del', id])];
  for(let k=0; k<ops.length; k+=10){
    const part = ops.slice(k,k+10), b = writeBatch(db);
    part.forEach(([t,x]) => t==='set' ? b.set(doc(db,'items',x.id), JSON.parse(JSON.stringify(x))) : b.delete(doc(db,'items',x)));
    await b.commit();
    part.forEach(([t,x]) => t==='set' ? SYNCED.set(x.id, cur.get(x.id)) : SYNCED.delete(x));
  }
  if(ops.length) toast('تم الحفظ في Firebase ✓');
}
const persist = () => {
  if(!CLOUD_OK){ toast(CLOUD_BUSY ? 'جارٍ الاتصال بـ Firebase… انتظر قليلًا ثم أعد المحاولة.' : 'لا يوجد اتصال بـ Firebase، لم يتم الحفظ ('+CLOUD_ERR+').'); return false; }
  const first = SYNCED.size === 0;
  ITEMS.forEach((i,k) => { if(i.ord == null) i.ord = first ? k : Date.now()+k; });
  syncQ = syncQ.then(pushChanges).catch(err => { console.error(err); toast('فشل الحفظ في Firebase: '+(err.code||err.message)); });
  return true;
};

const shrink = file => new Promise(res => { const im = new Image(); im.onload = () => { const w=300,h=450,c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'), r=Math.max(w/im.width,h/im.height); x.drawImage(im,(w-im.width*r)/2,(h-im.height*r)/2,im.width*r,im.height*r); res(c.toDataURL('image/webp',.82)); }; im.src = URL.createObjectURL(file); });

  $('#sh').onclick = () => { const i = $('[name=p]'); i.type = i.type==='password' ? 'text' : 'password'; $('#sh').textContent = i.type==='password' ? 'إظهار' : 'إخفاء'; };
  $('#lf').onsubmit = async e => { e.preventDefault(); const f = e.target, er = $('#er'), a = ls.get('adm_try',{n:0,until:0}), r = f.r.checked;

async function loadLocal(){
  let d = null, st = null;
  try{ const r = await fetch('catalog.json',{cache:'no-store'}); if(r.ok){ const j = await r.json(); if(Array.isArray(j)) d = j; else if(j && Array.isArray(j.items)){ d = j.items; st = j.site; } } }catch(e){}
  ITEMS.splice(0, ITEMS.length, ...(Array.isArray(d) ? d : SEED));
  SET = Object.assign({name:SITE_NAME,footer:''}, st || {});
}
async function loadCloud(){
  CLOUD_BUSY = true; CLOUD_ERR = '';
  try{
    const [qs, cs] = await Promise.race([Promise.all([getDocs(collection(db,'items')), getDoc(doc(db,'config','site'))]), new Promise((_,rj) => setTimeout(() => rj(new Error('انتهت مهلة الاتصال (12 ثانية)')), 12000))]);
    CLOUD_OK = true; CLOUD_EMPTY = qs.empty; SYNCED.clear();
    if(!qs.empty){ const d = qs.docs.map(x => x.data()).sort((a,b) => (a.ord ?? 1e15) - (b.ord ?? 1e15)); d.forEach(i => SYNCED.set(i.id, JSON.stringify(i))); ITEMS.splice(0, ITEMS.length, ...d); }
    if(cs.exists()) SET = Object.assign({name:SITE_NAME,footer:''}, cs.data());
  }catch(e){ CLOUD_OK = false; CLOUD_ERR = e.code || e.message; console.error('Firestore:', e); toast('تعذّر الاتصال بـ Firebase: '+CLOUD_ERR); }
  CLOUD_BUSY = false;
}
async function load(){ await loadLocal(); await loadCloud(); }

  fm.elements.purl.oninput = e => { pdata = e.target.value.trim(); if(pdata) $('#pp').src = pdata; };
  fm.onsubmit = e => { e.preventDefault(); const g = n => fm.elements[n].value.trim(), list = n => g(n).split(/[,،]/).map(x=>x.trim()).filter(Boolean), type = g('type');
    const o = { id: it.id || type[0]+Date.now().toString(36), type, title:g('title'), year:+g('year')||2026, rating:+g('rating')||0, minutes:+g('minutes')||0, country:g('country'),
      genres: list('genres').length ? list('genres') : ['أخرى'], cast:list('cast'), summary:g('summary'), poster:pdata, cover:g('cover'), added: it.added || new Date().toISOString().slice(0,10), ord: it.ord };
    if(type==='movie') o.video = g('video'); else o.seasons = textToSeasons(fm.elements.seasons.value);
    const k = ITEMS.findIndex(x=>x.id===o.id); if(k<0) ITEMS.push(o); else ITEMS[k] = o;
    if(persist()){ dg.close(); toast(id?'تم حفظ التعديل':'تمت إضافة العمل'); logAct(id?'تعديل عمل':'إضافة عمل',o.title); render(); } };
  dg.showModal();
}

/* ---------- استيراد ذكي من رابط ---------- */
function openImport(){
  const dg = $('#dg');
  dg.innerHTML = `<form id="aif"><h2>✨ استيراد من رابط</h2><div class="fg">
    <label class="f w">رابط صفحة العمل<input name="url" type="url" required placeholder="https://..." dir="ltr"></label>
    <label class="f">النوع<select name="type"><option value="">تلقائي</option><option value="movie">فيلم</option><option value="series">مسلسل</option></select></label>
    <label class="f">رابط الفيديو (اختياري)<input name="video" dir="ltr" placeholder="mp4 / m3u8 / embed"></label></div>
    <p id="aie" style="color:#ff9a9a;min-height:1.3em;margin:8px 0"></p>
    <div class="acts"><button type="button" class="btn g sm" data-a="close">إلغاء</button><button class="btn sm" id="aib">استخراج البيانات</button></div></form>`;
  $('#aif').onsubmit = async e => {
    e.preventDefault(); const f = e.target, er = $('#aie'), btn = $('#aib');
    const url = f.url.value.trim(), type = f.type.value, vid = f.video.value.trim();
    if(!IMPORT_API){ er.textContent = 'ضع رابط الـ Worker في المتغير IMPORT_API داخل الملف أولًا.'; return; }
    btn.disabled = true; btn.textContent = 'جارٍ الاستخراج… (قد يأخذ حتى 30 ثانية)'; er.textContent = '';
    try{
      const tok = await auth.currentUser.getIdToken();
      const r = await fetch(IMPORT_API, {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok}, body: JSON.stringify({url, type})});
      const d = await r.json(); if(!r.ok) throw new Error(d.error || ('خطأ '+r.status));
      let poster = '';
      if(d.poster){ try{ poster = await shrink(await (await fetch(d.poster)).blob()); }catch(_){} }
      dg.close();
      openForm(null, d.type, {type:d.type, title:d.title||'', year:d.year||2026, rating:d.rating||7, minutes:d.minutes||100, country:d.country||'',
        genres:d.genres||[], cast:d.cast||[], summary:d.summary||'', poster, video: vid});
      logAct('استيراد من رابط', d.title||url); toast('راجع البيانات ثم اضغط حفظ');
    }catch(err){ er.textContent = 'فشل الاستخراج: '+(err.message||err); btn.disabled = false; btn.textContent = 'استخراج البيانات'; }
  };
  dg.showModal();
}


onAuthStateChanged(auth, u => { if(u) showApp(); else { showLogin(LOGIN_MSG); LOGIN_MSG = ''; } });

</script>
