<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12101c;--surface:#1c1930;--line:#2c2848;--text:#f3f0ff;--muted:#a49fc4;--accent:#f2b84b;--accent-ink:#2a1d00;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Readex Pro',Tahoma,sans-serif;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1240px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(18,16,28,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem;padding-inline-start:2px}
.lbl{color:var(--muted);font-weight:400;font-size:.95rem;border-inline-start:1px solid var(--line);padding-inline-start:14px;margin-inline-start:4px}
.rate{color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:10px;padding:11px 26px;border-radius:99px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(242,184,75,.35)}
.ad{padding:30px 0}
.ad-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.ad h1{font-size:1.7rem}
.note{color:var(--muted);font-size:.9rem;margin-bottom:22px;max-width:75ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.stat b{display:block;font-size:1.9rem;line-height:1.3;color:var(--accent)}
.stat span{color:var(--muted);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools input{flex:1;min-width:200px}
.fi,.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:8px 12px;width:100%}
.fi:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.tools select{width:auto}
.btn.g{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn.g:hover{border-color:var(--accent);box-shadow:none}
.btn.sm{padding:7px 18px;font-size:.9rem}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-weight:400;background:var(--surface)}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(255,255,255,.03)}
tr:last-child td{border-bottom:0}
.th{width:42px;height:63px;border-radius:6px;object-fit:cover;display:block}
.ib{display:inline-block;padding:3px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;margin-inline-end:6px;transition:border-color .2s,color .2s}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib.del:hover{border-color:#ff7b7b;color:#ff7b7b}
dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:26px;width:min(740px,94vw);max-height:92vh;overflow:auto;margin:auto}
dialog[open]{animation:rise .35s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
dialog h2{margin-bottom:16px;font-size:1.25rem}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.f.w{grid-column:1/-1}
.f textarea{min-height:90px;resize:vertical}
.f small{font-size:.8rem}
.pp{display:flex;gap:12px;align-items:center}
.pp img{width:54px;height:81px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.hid{display:none!important}
#toast{position:fixed;bottom:26px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--accent);color:var(--accent-ink);padding:10px 24px;border-radius:99px;font-weight:600;z-index:50;opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
#toast.on{opacity:1;transform:none}
@media(max-width:600px){.fg{grid-template-columns:1fr}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar"><a class="brand" href="index.html"><span class="mark">▶</span><span id="bn"></span><span class="lbl">لوحة التحكم</span></a></div></header>
<main id="app"></main>
<script>
const SITE_NAME = "منصتي للمشاهدة";   /* اسم الموقع */
const SITE_URL = "index.html";         /* رابط الموقع الرئيسي */

const $ = s => document.querySelector(s), app = $('#app'), ITEMS = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = t => [...t].reduce((a,c)=>a+c.charCodeAt(0),0) % 360;
const kind = i => i.type==='movie' ? 'فيلم' : 'مسلسل';
/* صور تلقائية: لو ما كتبتش poster أو cover بيتولّد غلاف فني بالعنوان */
function art(title, w, h){
  const a = hue(title), b = (a+60)%360, c = (a+190)%360, r = [...title].length % 3;
  const sun = r===0 ? `<circle cx="${w*.7}" cy="${h*.3}" r="${w*.16}" fill="hsl(${b} 90% 70%)" opacity=".9"/>`
    : r===1 ? `<circle cx="${w*.3}" cy="${h*.32}" r="${w*.2}" fill="none" stroke="hsl(${b} 90% 70%)" stroke-width="${w*.015}"/><circle cx="${w*.3}" cy="${h*.32}" r="${w*.1}" fill="hsl(${b} 90% 70%)"/>`
    : `<path d="M0 ${h*.2}L${w} ${h*.05}V${h*.15}L0 ${h*.32}Z" fill="hsl(${b} 90% 65%)" opacity=".75"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><defs>
    <linearGradient id="g" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="hsl(${a} 55% 30%)"/><stop offset="1" stop-color="hsl(${c} 50% 10%)"/></linearGradient>
    <linearGradient id="f" x1="0" y1=".4" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#g)"/>${sun}
    <path d="M0 ${h*.72}L${w*.22} ${h*.5}L${w*.45} ${h*.68}L${w*.7} ${h*.42}L${w} ${h*.66}V${h}H0Z" fill="hsl(${c} 45% 16%)" opacity=".85"/>
    <path d="M0 ${h*.84}L${w*.3} ${h*.62}L${w*.58} ${h*.8}L${w*.82} ${h*.6}L${w} ${h*.78}V${h}H0Z" fill="hsl(${c} 40% 9%)"/>
    <rect width="${w}" height="${h}" fill="url(#f)"/>
    <text x="${w/2}" y="${h*.9}" text-anchor="middle" direction="rtl" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="${w*(h>w?.085:.05)}" fill="#fff">${esc(title.replace('عنوان تجريبي: ',''))}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============ لوحة التحكم (#admin) ============ */
const toast = m => { let t = $('#toast'); if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2600); };
const persist = () => { try{ localStorage.setItem('catalog_v1', JSON.stringify(ITEMS)); return true; }
  catch(e){ toast('مساحة التخزين ممتلئة. صدّر الملف أو صغّر الصور.'); return false; } };
const shrink = file => new Promise(res => { const im = new Image(); im.onload = () => { const w=300,h=450,c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'), r=Math.max(w/im.width,h/im.height); x.drawImage(im,(w-im.width*r)/2,(h-im.height*r)/2,im.width*r,im.height*r); res(c.toDataURL('image/webp',.82)); }; im.src = URL.createObjectURL(file); });
const seasonsToText = ss => (ss||[]).map(s => '# '+s.name+'\n'+s.episodes.map(e => e.t+' | '+(e.video||'')).join('\n')).join('\n');
const textToSeasons = t => { const out=[]; let cur=null;
  t.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l => {
    if(l.startsWith('#')){ cur = {name:l.replace(/^#+\s*/,'')||'الموسم '+(out.length+1), episodes:[]}; out.push(cur); }
    else { if(!cur){ cur={name:'الموسم 1',episodes:[]}; out.push(cur); } const [a,...b]=l.split('|'); cur.episodes.push({t:a.trim(), video:b.join('|').trim()}); } });
  return out.length ? out : [{name:'الموسم 1',episodes:[]}]; };
const rowsHtml = (q,t) => ITEMS.filter(i => (!t||i.type===t) && (!q || (i.title+' '+i.genres.join(' ')).toLowerCase().includes(q))).map(i =>
  `<tr><td><img class="th" src="${esc(i.poster||art(i.title,100,150))}" alt=""></td><td><b>${esc(i.title)}</b></td><td>${kind(i)}</td><td>${i.year}</td><td class="rate">★ ${i.rating}</td><td>${esc(i.genres.join('، '))}</td>
  <td style="white-space:nowrap"><button class="ib" data-a="edit" data-id="${i.id}">تعديل</button><a class="ib" href="${SITE_URL}#${i.id}" target="_blank" rel="noopener">عرض</a><button class="ib del" data-a="del" data-id="${i.id}">حذف</button></td></tr>`).join('')
  || `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">لا توجد أعمال مطابقة.</td></tr>`;

function admin(){
  const mv = ITEMS.filter(i=>i.type==='movie').length, eps = ITEMS.reduce((n,i)=>n+(i.seasons?i.seasons.reduce((m,s)=>m+s.episodes.length,0):0),0);
  const avg = ITEMS.length ? (ITEMS.reduce((n,i)=>n+(+i.rating||0),0)/ITEMS.length).toFixed(1) : '—';
  app.innerHTML = `<div class="wrap ad">
    <div class="ad-top"><h1>إدارة المحتوى</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn g sm" href="${SITE_URL}">عرض الموقع</a><button class="btn g sm" data-a="export">تصدير catalog.json</button>
      <button class="btn g sm" data-a="import">استيراد</button><button class="btn g sm" data-a="reset">استعادة من catalog.json</button>
      <button class="btn sm" data-a="add">+ إضافة عمل</button><input type="file" id="imp" accept="application/json" class="hid"></div></div>
    <p class="note">التعديلات تُحفظ في هذا المتصفح وتظهر في الموقع فورًا هنا. لنشرها للزوّار: اضغط «تصدير» وارفع ملف catalog.json بجوار index.html على الاستضافة.</p>
    <div class="stats"><div class="stat"><b>${ITEMS.length}</b><span>إجمالي الأعمال</span></div><div class="stat"><b>${mv}</b><span>أفلام</span></div>
      <div class="stat"><b>${ITEMS.length-mv}</b><span>مسلسلات</span></div><div class="stat"><b>${eps}</b><span>حلقات</span></div><div class="stat"><b>${avg}</b><span>متوسط التقييم</span></div></div>
    <div class="tools"><input class="fi" id="aq" placeholder="ابحث بالاسم أو التصنيف" aria-label="بحث"><select class="fi" id="at" aria-label="النوع"><option value="">الكل</option><option value="movie">أفلام</option><option value="series">مسلسلات</option></select></div>
    <div class="tw"><table><thead><tr><th></th><th>العنوان</th><th>النوع</th><th>السنة</th><th>التقييم</th><th>التصنيف</th><th>إجراءات</th></tr></thead><tbody id="tb">${rowsHtml('','')}</tbody></table></div>
    <dialog id="dg"></dialog></div>`;
  const draw = () => $('#tb').innerHTML = rowsHtml($('#aq').value.trim().toLowerCase(), $('#at').value);
  $('#aq').oninput = draw; $('#at').onchange = draw;
  $('#imp').onchange = async e => { try{ const d = JSON.parse(await e.target.files[0].text()); if(!Array.isArray(d)) throw 0;
    ITEMS.splice(0,ITEMS.length,...d); persist(); toast('تم الاستيراد'); admin(); }catch(_){ toast('الملف غير صالح'); } };
}

function openForm(id){
  const it = ITEMS.find(x=>x.id===id) || {type:'movie',genres:[],cast:[],year:2026,rating:7,minutes:100,country:'',summary:'',video:'',poster:'',cover:'',seasons:[{name:'الموسم 1',episodes:[]}]};
  let pdata = it.poster || ''; const dg = $('#dg');
  dg.innerHTML = `<form id="fm"><h2>${id?'تعديل عمل':'إضافة عمل جديد'}</h2><div class="fg">
    <label class="f">النوع<select name="type"><option value="movie" ${it.type==='movie'?'selected':''}>فيلم</option><option value="series" ${it.type==='series'?'selected':''}>مسلسل</option></select></label>
    <label class="f">العنوان<input name="title" required value="${esc(it.title||'')}"></label>
    <label class="f">السنة<input name="year" type="number" value="${it.year}"></label>
    <label class="f">التقييم (من 10)<input name="rating" type="number" step="0.1" min="0" max="10" value="${it.rating}"></label>
    <label class="f">المدة (دقيقة)<input name="minutes" type="number" value="${it.minutes}"></label>
    <label class="f">بلد الإنتاج<input name="country" value="${esc(it.country||'')}"></label>
    <label class="f w">التصنيفات (افصل بفاصلة)<input name="genres" value="${esc(it.genres.join('، '))}"></label>
    <label class="f w">الممثلون (افصل بفاصلة)<input name="cast" value="${esc(it.cast.join('، '))}"></label>
    <label class="f w">الملخص<textarea name="summary">${esc(it.summary||'')}</textarea></label>
    <div class="f w"><span>البوستر</span><div class="pp"><img id="pp" src="${esc(pdata||art(it.title||'عمل',100,150))}" alt=""><div style="flex:1;display:grid;gap:8px">
      <input type="file" id="pf" accept="image/*"><input name="purl" placeholder="أو الصق رابط صورة" value="${pdata.startsWith('data:')?'':esc(pdata)}"></div></div></div>
    <label class="f w">صورة الغلاف العريضة (اختياري، رابط)<input name="cover" value="${esc(it.cover||'')}"></label>
    <label class="f w" id="fv">رابط الفيديو (ملف mp4 / m3u8 أو رابط embed)<input name="video" value="${esc(it.video||'')}"></label>
    <label class="f w" id="fs">المواسم والحلقات<textarea name="seasons" style="min-height:150px" placeholder="# الموسم 1&#10;الحلقة 1 | https://...">${esc(seasonsToText(it.seasons))}</textarea>
      <small>سطر لكل حلقة بالشكل: اسم الحلقة | رابط الفيديو. ابدأ كل موسم بسطر يبدأ بعلامة #</small></label></div>
    <div class="acts"><button type="button" class="btn g sm" data-a="close">إلغاء</button><button class="btn sm">حفظ</button></div></form>`;
  const fm = $('#fm'), sync2 = () => { const m = fm.elements.type.value==='movie'; $('#fv').classList.toggle('hid',!m); $('#fs').classList.toggle('hid',m); };
  fm.elements.type.onchange = sync2; sync2();
  $('#pf').onchange = async e => { if(e.target.files[0]){ pdata = await shrink(e.target.files[0]); $('#pp').src = pdata; fm.elements.purl.value = ''; } };
  fm.elements.purl.oninput = e => { pdata = e.target.value.trim(); if(pdata) $('#pp').src = pdata; };
  fm.onsubmit = e => { e.preventDefault(); const g = n => fm.elements[n].value.trim(), list = n => g(n).split(/[,،]/).map(x=>x.trim()).filter(Boolean), type = g('type');
    const o = { id: it.id || type[0]+Date.now().toString(36), type, title:g('title'), year:+g('year')||2026, rating:+g('rating')||0, minutes:+g('minutes')||0, country:g('country'),
      genres: list('genres').length ? list('genres') : ['أخرى'], cast:list('cast'), summary:g('summary'), poster:pdata, cover:g('cover'), added: it.added || new Date().toISOString().slice(0,10) };
    if(type==='movie') o.video = g('video'); else o.seasons = textToSeasons(fm.elements.seasons.value);
    const k = ITEMS.findIndex(x=>x.id===o.id); if(k<0) ITEMS.push(o); else ITEMS[k] = o;
    if(persist()){ dg.close(); toast(id?'تم حفظ التعديل':'تمت إضافة العمل'); admin(); } };
  dg.showModal();
}

app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(!b) return; const a = b.dataset.a, id = b.dataset.id;
  if(a==='add') openForm(); else if(a==='edit') openForm(id); else if(a==='close') $('#dg').close();
  else if(a==='del'){ const it = ITEMS.find(x=>x.id===id); if(it && confirm('حذف «'+it.title+'» نهائيًا؟')){ ITEMS.splice(ITEMS.indexOf(it),1); persist(); toast('تم الحذف'); admin(); } }
  else if(a==='export'){ const u = URL.createObjectURL(new Blob([JSON.stringify(ITEMS,null,1)],{type:'application/json'})), l = document.createElement('a'); l.href = u; l.download = 'catalog.json'; l.click(); URL.revokeObjectURL(u); }
  else if(a==='import') $('#imp').click();
  else if(a==='reset' && confirm('استعادة البيانات من catalog.json؟ ستُمسح تعديلاتك غير المصدَّرة في هذا المتصفح.')){ localStorage.removeItem('catalog_v1'); load(); } });


async function load(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem('catalog_v1') || 'null'); }catch(e){}
  if(!Array.isArray(d)){ try{ const r = await fetch('catalog.json', {cache:'no-store'}); if(r.ok) d = await r.json(); }catch(e){} }
  ITEMS.splice(0, ITEMS.length, ...(Array.isArray(d) ? d : /*SEED*/[]));
  admin();
  if(!ITEMS.length) toast('لم أجد catalog.json. استورد ملفًا أو ابدأ بإضافة عمل.');
}
$('#bn').textContent = SITE_NAME;
load();
</script>
</body>
</html>
