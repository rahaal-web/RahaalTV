name: Unzip

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "zip file name"
        required: true
        default: "files.zip"
      target_dir:
        description: "target folder (use . for root)"
        required: true
        default: "."

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p "${{ github.event.inputs.target_dir }}"
          unzip -o "${{ github.event.inputs.zip_file }}" -d "${{ github.event.inputs.target_dir }}"
          rm "${{ github.event.inputs.zip_file }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip ${{ github.event.inputs.zip_file }}"
          git push
